<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Embedded systems knowledge architecture</title><desc id="desc">Electronics informs both digital logic and PCB concepts; CPU and hardware paths converge in MCU system integration.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b949e"/></marker><style>.bg{fill:#0d1117}.grid{stroke:#30363d;opacity:.28}.box{stroke-width:2}.input{fill:#21262d;stroke:#8b949e}.core{fill:#0d419d;stroke:#58a6ff}.hardware{fill:#1f6f3d;stroke:#3fb950}.output{fill:#f0f6fc;stroke:#c9d1d9}.title{font:700 28px system-ui,sans-serif;fill:#f0f6fc}.sub{font:16px system-ui,sans-serif;fill:#8b949e}.label{font:700 17px system-ui,sans-serif;fill:#f0f6fc;text-anchor:middle}.detail{font:13px system-ui,sans-serif;fill:#c9d1d9;text-anchor:middle}.dark{fill:#0d1117}.arrow{fill:none;stroke:#8b949e;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1200" height="470" rx="22"/><path class="grid" d="M0 110H1200M0 370H1200M300 0V470M600 0V470M900 0V470"/>
  <text class="title" x="50" y="54">Embedded Systems Knowledge Architecture</text><text class="sub" x="50" y="84">Signals become logic, computation, hardware structure, and MCU integration</text>
  <rect class="box input" x="50" y="200" width="190" height="90" rx="14"/><text class="label" x="145" y="236">Electronics</text><text class="detail" x="145" y="264">signal · circuit</text>
  <rect class="box core" x="330" y="135" width="200" height="90" rx="14"/><text class="label" x="430" y="171">Digital Logic</text><text class="detail" x="430" y="199">gate · register</text>
  <rect class="box hardware" x="330" y="300" width="200" height="90" rx="14"/><text class="label" x="430" y="336">PCB Concepts</text><text class="detail" x="430" y="364">schematic · layout</text>
  <rect class="box core" x="620" y="135" width="200" height="90" rx="14"/><text class="label" x="720" y="171">CPU Model</text><text class="detail" x="720" y="199">ALU · data path</text>
  <rect class="box hardware" x="620" y="300" width="200" height="90" rx="14"/><text class="label" x="720" y="336">MCU Interfaces</text><text class="detail" x="720" y="364">GPIO · PWM · UART</text>
  <rect class="box output" x="920" y="215" width="230" height="90" rx="14"/><text class="label dark" x="1035" y="251">System Integration</text><text class="detail dark" x="1035" y="279">knowledge path</text>
  <path class="arrow" d="M240 230L330 180M240 260L330 345M530 180H620M530 345H620M820 180L920 240M820 345L920 280"/>
</svg>
